[project]
name = "equilibrafit-plusplus-ai"
version = "0.1.0"
description = "Internal FastAPI AI gateway for EquilibraFit++."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic-settings>=2.10.0",
    "openai>=1.97.0",
    "numpy>=2.2.0",
    "pandas>=2.3.0"
]

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.12.0",
    "ultralytics>=8.3.0"
]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
